# Perfil por defecto: base H2 en memoria, para correr sin instalar nada.
spring.application.name=taller-backend
spring.datasource.url=jdbc:h2:mem:taller
spring.jpa.hibernate.ddl-auto=update
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
management.endpoints.web.exposure.include=health
